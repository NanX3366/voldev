name: CI

# 推送到 main 或开 PR 时自动构建，构建产物（jar）可在 Actions 页面下载。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 同一分支连续推送时，取消上一次还在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # 构建机上没有本机 mavenLocal 里的 2.28.0-SNAPSHOT，
      # 用 -PhaloPlatform 切到中央仓库的正式版（build.gradle 里已参数化）
      - name: Build
        run: ./gradlew clean build -PhaloPlatform=2.27.3

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: plugin-voldev-${{ github.run_number }}
          path: build/libs/*.jar
          retention-days: 14
          if-no-files-found: error
