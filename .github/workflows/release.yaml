name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本号，形如 v1.0.28（必须与 gradle.properties 的 version 一致）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Check version matches tag
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r' | head -n1)"
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "gradle.properties: ${VERSION} / tag: ${TAG}"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::版本不一致：gradle.properties=${VERSION}，tag=${TAG}。先把 gradle.properties 的 version 改成 ${TAG#v} 再发版。"
            exit 1
          fi

      - name: Build
        run: ./gradlew clean build -PhaloPlatform=2.27.3

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jar
          path: build/libs/*.jar
          retention-days: 7

      - name: Build changelog
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          TARGET="${TAG}"
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || TARGET="HEAD"
          PREV="$(git describe --tags --abbrev=0 "${TARGET}^" 2>/dev/null || true)"
          if [ -n "${PREV}" ]; then
            RANGE="${PREV}..${TARGET}"
            TITLE="自 ${PREV} 以来的改动"
          else
            RANGE="${TARGET}"
            TITLE="首个版本"
          fi
          {
            echo "## ${TITLE}"
            echo
            git log "${RANGE}" --no-merges --pretty=format:'- %s' | sed '/^[[:space:]]*$/d'
            echo
            echo
            echo "安装包见下方 Assets 里的 \`plugin-voldev-${TAG#v}.jar\`。"
          } > release-notes.md
          echo "===== release-notes.md ====="
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build/libs/*.jar
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
