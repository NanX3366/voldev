plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.9.0"
}

group 'com.voldev.voldev'

repositories {

    mavenLocal()
    mavenCentral()
}

def haloPlatform = providers.gradleProperty('haloPlatform').getOrElse('2.28.0-SNAPSHOT')

dependencies {
    implementation platform("run.halo.tools.platform:plugin:${haloPlatform}")
    compileOnly 'run.halo.app:api'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {

    version = '2.27'
}

tasks.named('processResources') {
    inputs.property('pluginVersion', project.version)
    filesMatching('plugin.yaml') {
        expand(version: project.version)
    }
}

tasks.register('syncPluginComponentsIdx', Copy) {
    from layout.buildDirectory.dir('tmp/META-INF')
    include 'plugin-components.idx'
    into layout.buildDirectory.dir('resources/main/META-INF')
    dependsOn 'generatePluginComponentsIdx'
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    includeEmptyDirs = false
    finalizedBy 'syncPluginComponentsIdx'
}

tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}
