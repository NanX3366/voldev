plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.9.0"
}

group 'com.voldev.voldev'

repositories {
    // 优先使用 halo_dev 通过 publishToMavenLocal 发布的 2.28.0-SNAPSHOT 构件。
    // 换机器后先在 halo_dev 执行：
    // gradlew.bat :api:publishToMavenLocal :platform:application:publishToMavenLocal :platform:plugin:publishToMavenLocal
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.28.0-SNAPSHOT')
    compileOnly 'run.halo.app:api'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    // 这里的 version 决定 haloServer 拉取的 Halo 发行版（Docker 镜像）。
    // 2.28.0-SNAPSHOT 还没有公开发行版，所以保留 2.27；源码联调请使用
    // halo_dev 的 bootRun（dev,win,local）+ application-local.yaml 的 fixed-plugin-path。
    version = '2.27'
}

// plugin.yaml 里的 ${version} 用 gradle.properties 的 version 填充。
// Plugin CRD 把 spec.version 设为必填，不填的话在后台「重新加载」插件会报
//   spec: Field 'version' is required. (code: 1026)
// 声明成 input，改版本号时才会重新展开，否则会命中增量构建缓存。
tasks.named('processResources') {
    inputs.property('pluginVersion', project.version)
    filesMatching('plugin.yaml') {
        expand(version: project.version)
    }
}

// Halo 的插件组件索引（@Component 的类清单）由 generatePluginComponentsIdx 生成到
// build/tmp/META-INF/plugin-components.idx，只有打 jar 时才会被带进去。
// 但 dev 模式（fixed-plugin-path）加载的是 build/ 目录，目录里没有这份索引的话，
// 除主类以外的 @Component bean（比如 ThemeStyleFilter）根本不会被注册成 Spring bean，
// 表现为「插件能启动、UI 正常，但后端扩展完全不执行」。
tasks.register('syncPluginComponentsIdx', Copy) {
    from layout.buildDirectory.dir('tmp/META-INF')
    include 'plugin-components.idx'
    into layout.buildDirectory.dir('resources/main/META-INF')
    dependsOn 'generatePluginComponentsIdx'
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 空目录（src/main/resources/static 这种模板残留）不进包
    includeEmptyDirs = false
    finalizedBy 'syncPluginComponentsIdx'
}

// 用 Sync 而不是 Copy：前端每次构建都会生成新的 hash 文件名（main.<hash>.js），
// Copy 只做增量复制、不清理目标目录，旧文件会一直堆在 build/resources/main/ui 里被打进 jar。
// Sync 会先把目标目录同步成源目录的样子，历史产物自然被清掉。
tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}
